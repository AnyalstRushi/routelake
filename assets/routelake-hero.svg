<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="t d"><title id="t">RouteLake — The intelligence layer above the lakehouse</title><desc id="d">Abstract control plane connecting data trust, workload routing and spend intelligence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102b3b"/></linearGradient><linearGradient id="mint"><stop stop-color="#53e0ce"/><stop offset="1" stop-color="#7e9cff"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#426078" stroke-opacity=".25"/></pattern></defs><rect width="1400" height="360" rx="22" fill="url(#bg)"/><rect width="1400" height="360" rx="22" fill="url(#grid)"/><g fill="none" stroke="url(#mint)" stroke-width="2" opacity=".75"><circle cx="1080" cy="180" r="120" stroke-dasharray="5 10"><animateTransform attributeName="transform" type="rotate" from="0 1080 180" to="360 1080 180" dur="36s" repeatCount="indefinite"/></circle><circle cx="1080" cy="180" r="84" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="360 1080 180" to="0 1080 180" dur="28s" repeatCount="indefinite"/></circle><path d="M960 180H1015 M1145 180H1200 M1080 60V115 M1080 245V300" stroke-dasharray="4 8"/></g><circle cx="1080" cy="180" r="48" fill="#12394a" stroke="#53e0ce"/><text x="1080" y="176" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#eaffff">ROUTE</text><text x="1080" y="197" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#53e0ce">LAKE</text><g font-family="monospace" font-size="12" fill="#a7c0d1"><text x="930" y="40">DATA TRUST</text><text x="1210" y="184">COST MODEL</text><text x="930" y="330">SLO ROUTING</text></g><g fill="#53e0ce"><circle cx="960" cy="180" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle><circle cx="1200" cy="180" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle></g><text x="82" y="96" font-family="monospace" font-size="13" letter-spacing="5" fill="#53e0ce">OPEN-SOURCE DATA INFRASTRUCTURE / 2026</text><text x="78" y="176" font-family="Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-3" fill="#edf7ff">ROUTELAKE</text><text x="82" y="222" font-family="Arial,sans-serif" font-size="23" fill="#53e0ce">One dataset. Two engines. One cost brain.</text><text x="82" y="278" font-family="monospace" font-size="13" letter-spacing="2" fill="#91a6ba">TRUST THE DATA  /  ROUTE THE WORKLOAD  /  EXPLAIN THE COST</text></svg>