<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">RouteLake: one dataset, two engines, one cost brain</title>
  <desc id="d">Data droplets flow through a contract gate, split at a router between Snowflake and Databricks, and land in a lake. Invalid records fall out at the gate into quarantine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05121c"/><stop offset="1" stop-color="#0b2d3d"/>
    </linearGradient>
    <linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#2fd3c0"/><stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2fd3c0" stop-opacity="0.22"/><stop offset="1" stop-color="#2fd3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fd3e6" stroke-opacity="0.06"/>
    </pattern>
    <path id="pS" d="M700 40 C760 40 770 150 840 170 C920 170 930 90 1040 90 C1120 90 1170 200 1210 335"/>
    <path id="pD" d="M700 40 C760 40 770 150 840 170 C920 170 930 260 1040 260 C1120 260 1170 300 1210 340"/>
    <path id="pQ" d="M700 40 L700 130"/>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <!-- routes -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <use xlink:href="#pS" href="#pS" stroke="#ffb454" stroke-opacity="0.75" stroke-dasharray="7 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#pD" href="#pD" stroke="#ffb454" stroke-opacity="0.75" stroke-dasharray="7 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#pQ" href="#pQ" stroke="#ff6f8e" stroke-opacity="0.7" stroke-dasharray="4 7"/>
  </g>

  <!-- droplets -->
  <g fill="#2fd3c0">
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#pS" href="#pS"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#pS" href="#pS"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#pS" href="#pS"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6.6s" begin="-1s" repeatCount="indefinite"><mpath xlink:href="#pD" href="#pD"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="6.6s" begin="-3.2s" repeatCount="indefinite"><mpath xlink:href="#pD" href="#pD"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="6.6s" begin="-5.4s" repeatCount="indefinite"><mpath xlink:href="#pD" href="#pD"/></animateMotion></circle>
  </g>
  <circle r="5" fill="#ff6f8e">
    <animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#pQ" href="#pQ"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#d8eef4">
    <circle cx="700" cy="40" r="9" fill="#05121c" stroke="#2fd3c0" stroke-width="2.5"/>
    <text x="718" y="35">contract gate</text>
    <text x="718" y="126" fill="#ff6f8e">quarantine + reason code</text>
    <circle cx="840" cy="170" r="10" fill="#05121c" stroke="#ffb454" stroke-width="2.5">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="818" y="212">router</text>
    <circle cx="1040" cy="90" r="9" fill="#05121c" stroke="#ffb454" stroke-width="2.5"/>
    <text x="1004" y="68">Snowflake</text>
    <circle cx="1040" cy="260" r="9" fill="#05121c" stroke="#ffb454" stroke-width="2.5"/>
    <text x="1004" y="290">Databricks</text>
  </g>

  <!-- title block -->
  <g font-family="Georgia,'Times New Roman',serif">
    <text x="64" y="172" font-size="108" font-weight="700" letter-spacing="-3" fill="url(#ttl)">RouteLake</text>
  </g>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="68" y="226" font-size="27" fill="#d8eef4">One dataset. Two engines. One cost brain.</text>
    <text x="68" y="262" font-size="17" fill="#8fb3c1">A local-first lakehouse control plane for data trust, workload placement and spend intelligence.</text>
  </g>

  <!-- chips -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="68" y="286" width="170" height="38" rx="19" fill="none" stroke="#2fd3c0"/>
    <text x="153" y="310" text-anchor="middle" fill="#2fd3c0">Trust the data</text>
    <rect x="252" y="286" width="196" height="38" rx="19" fill="none" stroke="#ffb454"/>
    <text x="350" y="310" text-anchor="middle" fill="#ffb454">Route the workload</text>
    <rect x="462" y="286" width="178" height="38" rx="19" fill="none" stroke="#ff9ab0"/>
    <text x="551" y="310" text-anchor="middle" fill="#ff9ab0">Explain the cost</text>
  </g>

  <!-- lake -->
  <path fill="#2fd3c0" fill-opacity="0.22" d="M-640 372 Q-560 352 -480 372 T-320 372 T-160 372 T0 372 T160 372 T320 372 T480 372 T640 372 T800 372 T960 372 T1120 372 T1280 372 T1440 372 L1440 440 L-640 440Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="320 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#2fd3c0" fill-opacity="0.34" d="M-640 396 Q-560 378 -480 396 T-320 396 T-160 396 T0 396 T160 396 T320 396 T480 396 T640 396 T800 396 T960 396 T1120 396 T1280 396 T1440 396 L1440 440 L-640 440Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-320 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="1200" y="424" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#bfeee7" fill-opacity="0.8">Bronze → Silver → Gold</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
