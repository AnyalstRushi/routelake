<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">RouteLake architecture</title>
  <desc id="d">Data plane: event sources to Bronze, contract gate, Silver and Gold, with invalid records going to quarantine. Control plane: workload catalog and measured calibration feed the cost model and router, which picks Snowflake or Databricks candidates, then normalized billing and a median/MAD anomaly detector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05121c"/><stop offset="1" stop-color="#0b2d3d"/></linearGradient>
    <marker id="aT" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2fd3c0"/></marker>
    <marker id="aA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ffb454"/></marker>
    <marker id="aR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff6f8e"/></marker>
  </defs>
  <rect width="1100" height="450" rx="22" fill="url(#bg)"/>

  <!-- planes -->
  <rect x="10" y="26" width="1080" height="196" rx="18" fill="#2fd3c0" fill-opacity="0.05" stroke="#2fd3c0" stroke-opacity="0.45"/>
  <rect x="10" y="238" width="1080" height="200" rx="18" fill="#ffb454" fill-opacity="0.05" stroke="#ffb454" stroke-opacity="0.45"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="28" y="50" fill="#2fd3c0">Data plane: correctness</text>
    <text x="28" y="262" fill="#ffb454">Control plane: decisions</text>
  </g>

  <!-- edges: data plane -->
  <g stroke-width="2" fill="none">
    <path d="M190 107 L228 107" stroke="#2fd3c0" marker-end="url(#aT)"/>
    <path d="M400 107 L438 107" stroke="#2fd3c0" marker-end="url(#aT)"/>
    <path d="M610 107 L648 107" stroke="#2fd3c0" marker-end="url(#aT)"/>
    <path d="M820 107 L858 107" stroke="#2fd3c0" marker-end="url(#aT)"/>
    <path d="M525 134 L525 164" stroke="#ff6f8e" stroke-dasharray="4 4" marker-end="url(#aR)"/>
    <!-- control plane -->
    <path d="M190 327 L228 327" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M400 327 L438 305" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M400 327 L438 360" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M610 305 L648 327" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M610 360 L648 327" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M820 327 L858 327" stroke="#ffb454" marker-end="url(#aA)"/>
    <path d="M315 382 L315 356" stroke="#ffb454" marker-end="url(#aA)"/>
  </g>

  <!-- packets -->
  <g fill="#2fd3c0">
    <circle r="4"><animateMotion dur="1.4s" repeatCount="indefinite" path="M190 107 L228 107"/></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="-0.5s" repeatCount="indefinite" path="M400 107 L438 107"/></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="-0.9s" repeatCount="indefinite" path="M610 107 L648 107"/></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="-0.2s" repeatCount="indefinite" path="M820 107 L858 107"/></circle>
  </g>
  <circle r="4" fill="#ff6f8e"><animateMotion dur="1.6s" repeatCount="indefinite" path="M525 134 L525 164"/><animate attributeName="opacity" values="1;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
  <g fill="#ffb454">
    <circle r="4"><animateMotion dur="1.4s" repeatCount="indefinite" path="M190 327 L228 327"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite" path="M400 327 L438 305"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" path="M400 327 L438 360"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="-0.3s" repeatCount="indefinite" path="M610 305 L648 327"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite" path="M610 360 L648 327"/></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="-0.6s" repeatCount="indefinite" path="M820 327 L858 327"/></circle>
    <circle r="4"><animateMotion dur="1.2s" repeatCount="indefinite" path="M315 382 L315 356"/></circle>
  </g>

  <!-- nodes: data plane -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e9f4f7" text-anchor="middle">
    <g stroke="#2fd3c0" fill="#0a2432">
      <rect x="20" y="80" width="170" height="54" rx="12"/>
      <rect x="230" y="80" width="170" height="54" rx="12"/>
      <rect x="440" y="80" width="170" height="54" rx="12" stroke-width="2.5"/>
      <rect x="650" y="80" width="170" height="54" rx="12"/>
      <rect x="860" y="80" width="170" height="54" rx="12"/>
    </g>
    <rect x="440" y="166" width="170" height="46" rx="12" fill="#2a1020" stroke="#ff6f8e"/>
    <text x="105" y="104" stroke="none">Event sources</text><text x="105" y="123" font-size="12" font-weight="400" fill="#8fb3c1">raw events</text>
    <text x="315" y="104">Bronze</text><text x="315" y="123" font-size="12" font-weight="400" fill="#8fb3c1">append-only</text>
    <text x="525" y="104">Contract gate</text><text x="525" y="123" font-size="12" font-weight="400" fill="#8fb3c1">validate + dedupe</text>
    <text x="735" y="104">Silver</text><text x="735" y="123" font-size="12" font-weight="400" fill="#8fb3c1">typed + deduped</text>
    <text x="945" y="104">Gold</text><text x="945" y="123" font-size="12" font-weight="400" fill="#8fb3c1">reconciled marts</text>
    <text x="525" y="186" fill="#ff9ab0">Quarantine</text><text x="525" y="203" font-size="12" font-weight="400" fill="#ff9ab0">reason codes</text>

    <!-- nodes: control plane -->
    <g stroke="#ffb454" fill="#2a1f0c">
      <rect x="20" y="300" width="170" height="54" rx="12"/>
      <rect x="230" y="300" width="170" height="54" rx="12" stroke-width="2.5"/>
      <rect x="440" y="284" width="170" height="42" rx="12"/>
      <rect x="440" y="340" width="170" height="42" rx="12"/>
      <rect x="650" y="300" width="170" height="54" rx="12"/>
      <rect x="860" y="300" width="170" height="54" rx="12"/>
      <rect x="230" y="384" width="170" height="42" rx="12"/>
    </g>
    <text x="105" y="324">Workload catalog</text><text x="105" y="343" font-size="12" font-weight="400" fill="#c9ad7a">+ latency SLO</text>
    <text x="315" y="324">Cost model + router</text><text x="315" y="343" font-size="12" font-weight="400" fill="#c9ad7a">hysteresis</text>
    <text x="525" y="310">Snowflake candidate</text>
    <text x="525" y="366">Databricks candidate</text>
    <text x="735" y="324">Normalized billing</text><text x="735" y="343" font-size="12" font-weight="400" fill="#c9ad7a">both vendors</text>
    <text x="945" y="324">Anomaly detector</text><text x="945" y="343" font-size="12" font-weight="400" fill="#c9ad7a">median / MAD</text>
    <text x="315" y="410">Measured calibration</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
